title: SSH Brute Force From Single Source IP
id: 04d9cf2f-790e-4847-8309-bee27d572944
status: experimental
description: >
  Detects a burst of failed SSH password attempts from one source IP
  within a short time window.
author: auth-log-triage demo
date: 2026-11-05
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: auth
detection:
  selection:
    Message|contains: 'Failed password'
  timeframe: 5m
  condition: selection | count() by src_ip > 10
falsepositives:
  - Misconfigured automation retrying with a wrong password
  - Vulnerability scanners run by the security team
level: high
